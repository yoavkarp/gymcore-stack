type ActiveWorkout implements Document {
  id: ID!
  tenantId: ID!
  clubId: ID!
  workoutId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  started_at: AWSDateTime!
  end_at: AWSDateTime
  name: String!
  exercises: [ActiveExercise!]
  memberId: ID!
  planId: ID
  notes: String
}

type ActiveWorkoutConnection {
  items: [ActiveWorkout!]
  nextToken: String
}

union ActiveExercise = ActiveStrengthExercise | ActiveCardioExercise

type ActiveStrengthExercise {
  id: ID!
  xid: ID!
  name: String!
  type: ExerciseType!
  notes: String
  machine_number: String
  seat_height: String
  angle: ActiveParameter
  resistance: ActiveParameter
  sets: [ActiveStrengthExerciseSet]
}

type ActiveCardioExercise {
  id: ID!
  xid: ID!
  name: String!
  type: ExerciseType!
  notes: String
  machine_number: String
  seat_height: String
  angle: ActiveParameter
  resistance: ActiveParameter
  intervals: [ActiveCardioExerciseInterval]
}

type ActiveStrengthExerciseSet {
  id: ID!
  reps: ActiveParameter
  rest: ActiveParameter
  weight: ActiveParameter
  dropsets: [ActiveStrengthExerciseDropSet!]
}

type ActiveStrengthExerciseDropSet {
  id: ID!
  reps: ActiveParameter
  weight: ActiveParameter
}

type ActiveCardioExerciseInterval {
  id: ID!
  duration: ActiveParameter
  distance: ActiveParameter
  tempo: ActiveParameter
  intensity: ActiveParameter
  angle: ActiveParameter
  resistance: ActiveParameter
  rest: ActiveParameter
}

type ActiveParameter {
  val: Float
  max: Float
  unit: String
  done: Float
}

interface Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
}

type Event {
  tenantId: ID!
  id: ID!
  clubId: ID!
  trainerId: ID!
  memberId: ID!
  start_at: AWSDateTime!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
}

type EventConnection {
  items: [Event!]
  nextToken: String
}

enum Gender {
  MALE
  FEMALE
  OTHER
}

type Goal implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  memberId: ID!
  clubId: ID
  title: String!
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
  completed: Boolean
  completed_at: AWSDateTime
}

type GoalConnection {
  items: [Goal!]
  nextToken: String
}

type Measurement implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  memberId: ID!
  clubId: ID
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
}

type MeasurementConnection {
  items: [Measurement!]
  nextToken: String
}

input CreateMeasurementInput {
  memberId: ID
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
}

type Mutation {
  test(input: CreateMeasurementInput!): Measurement @aws_auth(cognito_groups: ["club", "member"])
  createMeasurementForMember(memberId: ID!, input: CreateMeasurementInput!): Measurement @aws_auth(cognito_groups: ["club"])
  createMember(input: CreateMemberInput!): Member @aws_auth(cognito_groups: ["club"])
  createTrainer(input: CreateTrainerInput!): Trainer @aws_auth(cognito_groups: ["club"])
  createEvent(input: CreateEventInput!): Event @aws_auth(cognito_groups: ["club"])
  deleteEvent(eventId: ID!): Event @aws_auth(cognito_groups: ["club"])
  createPlan(trainerId: ID!, input: CreatePlanInput!): Plan @aws_auth(cognito_groups: ["club"])
  deletePlan(planId: ID!): Plan @aws_auth(cognito_groups: ["club"])
  createWorkout(trainerId: ID!, input: CreateWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateWorkout(trainerId: ID!, workoutId: ID!, input: UpdateWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteWorkout(workoutId: ID!): Workout @aws_auth(cognito_groups: ["club"])
  addExerciseToWorkout(trainerId: ID!, workoutId: ID!, input: AddExerciseToWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateExerciseInWorkout(trainerId: ID!, workoutId: ID!, exerciseId: ID!, input: UpdateExerciseInWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteExerciseFromWorkout(trainerId: ID!, workoutId: ID!, exerciseId: ID!): Workout @aws_auth(cognito_groups: ["club"])
  addSetToExercise(trainerId: ID!, workoutId: ID!, exerciseId: ID!, input: SetInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateSetInExercise(trainerId: ID!, workoutId: ID!, exerciseId: ID!, setId: ID!, input: SetInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteSetFromExercise(trainerId: ID!, workoutId: ID!, exerciseId: ID!, setId: ID!): Workout @aws_auth(cognito_groups: ["club"])
  addIntervalToExercise(trainerId: ID!, workoutId: ID!, exerciseId: ID!, input: IntervalInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateIntervalInExercise(trainerId: ID!, workoutId: ID!, exerciseId: ID!, intervalId: ID!, input: IntervalInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteIntervalFromExercise(trainerId: ID!, workoutId: ID!, exerciseId: ID!, intervalId: ID!): Workout @aws_auth(cognito_groups: ["club"])
  addWorkoutToLibrary(trainerId: ID!, workoutId: ID!): Workout @aws_auth(cognito_groups: ["club"])
  importWorkoutFromLibrary(trainerId: ID!, workoutId: ID!, input: ImportWorkoutFromLibraryInput!): Workout @aws_auth(cognito_groups: ["club"])
  moveSetInExercise(trainerId: ID!, workoutId: ID!, exerciseId: ID!, from: Int!, to: Int!): Workout @aws_auth(cognito_groups: ["club"])
  moveIntervalInExercise(trainerId: ID!, workoutId: ID!, exerciseId: ID!, from: Int!, to: Int!): Workout @aws_auth(cognito_groups: ["club"])
  moveExerciseInWorkout(trainerId: ID!, workoutId: ID!, from: Int!, to: Int!): Workout @aws_auth(cognito_groups: ["club"])
  startActiveWorkout(workoutId: ID!): ActiveWorkout @aws_auth(cognito_groups: ["member"])
  endActiveWorkout: ActiveWorkout @aws_auth(cognito_groups: ["member"])
  endActiveWorkoutInterval(input: EndIntervalInput!): ActiveWorkout @aws_auth(cognito_groups: ["member"])
  endActiveWorkoutSet(input: EndSetInput!): ActiveWorkout @aws_auth(cognito_groups: ["member"])
  endActiveWorkoutDropset(input: EndDropsetInput!): ActiveWorkout @aws_auth(cognito_groups: ["member"])
  createMeasurement(input: CreateMeasurementInput!): Measurement @aws_auth(cognito_groups: ["member"])
  register(input: RegisterInput!): Member @aws_auth(cognito_groups: ["member"])
  updateMemberProfile(input: UpdateMemberProfileInput!): Member @aws_auth(cognito_groups: ["member"])
}

type Plan implements Document {
  id: ID!
  tenantId: ID!
  memberId: ID!
  trainerId: ID!
  notes: String
  workouts: WorkoutConnection
  clubId: ID!
  weeks: Int!
  meetings: Int!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  member: Member
  trainer: Trainer
  events: EventConnection
}

type PlanConnection {
  items: [Plan!]
  nextToken: String
}

type Query {
  getClubById(clubId: ID!): Club @aws_auth(cognito_groups: ["club", "member"])
  getTrainerById(trainerId: ID!): Trainer @aws_auth(cognito_groups: ["club", "member"])
  getTenant: Tenant @aws_auth(cognito_groups: ["club", "member"])
  getWorkoutById(workoutId: ID!): Workout @aws_auth(cognito_groups: ["club", "member"])
  getClubTrainers: [Trainer!] @aws_auth(cognito_groups: ["club"])
  getMemberById(memberId: ID!): Member @aws_auth(cognito_groups: ["club"])
  getPlanById(planId: ID!): Plan @aws_auth(cognito_groups: ["club"])
  listLibraryWorkouts(limit: Int, nextToken: String): WorkoutConnection @aws_auth(cognito_groups: ["club"])
  listPlansByMemberId(memberId: ID!, limit: Int, nextToken: String): PlanConnection @aws_auth(cognito_groups: ["club"])
  listPlansByTrainerId(trainerId: ID!, limit: Int, nextToken: String): PlanConnection @aws_auth(cognito_groups: ["club"])
  listPlansByClub(limit: Int, nextToken: String): PlanConnection @aws_auth(cognito_groups: ["club"])
  searchMembers(text: String!): [Member] @aws_auth(cognito_groups: ["club"])
  getActiveWorkout: ActiveWorkout @aws_auth(cognito_groups: ["member"])
  getCurrentMember: Member @aws_auth(cognito_groups: ["member"])
  listActiveWorkoutsHistory: ActiveWorkoutConnection @aws_auth(cognito_groups: ["member"])
}

type Tenant {
  id: ID!
  name: String!
  email: AWSEmail!
  phone_number: AWSPhone!
  profile_picture: AWSURL!
  address: String!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
}

type Trainer implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  phone_number: AWSPhone!
  name: String!
  email: AWSEmail
  birthdate: AWSDate!
  gender: Gender!
  address: String
  picture: AWSURL
}

type TrainerConnection {
  items: [Trainer!]
  nextToken: String
}

type Workout implements Document {
  id: ID!
  tenantId: ID!
  clubId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  trainerId: ID!
  memberId: ID
  name: String!
  notes: String
  exercises: [Exercise!]
  library: Boolean
  trainer: Trainer
}

type WorkoutConnection {
  items: [Workout!]
  nextToken: String
}

union Exercise = StrengthExercise | CardioExercise

type StrengthExercise {
  id: ID!
  xid: ID!
