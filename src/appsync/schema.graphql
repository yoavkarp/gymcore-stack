# Member.gql
type Member {
    id: String!
    name: String!
    email: String!
    phoneNumber: String!
    status: String!
    createdAt: AWSTimestamp!
    updatedAt: AWSTimestamp!
}

type MemberConnection {
    items: [Member!]
    nextToken: String
}

input InviteMemberInput {
    name: String!
    email: String!
    phoneNumber: String!
}

# Mutation.gql
type Mutation {
    inviteMember(input: InviteMemberInput!): Member
    deleteMember(id: String!): Member
}

# Query.gql
type Query {
    getMemberById(id: String!): Member
    searchMembers(query: String!, limit: Int): [Member!]
    getCurrentMember: Member
}

input ListQueryInput {
    nextToken: String
    limit: Int
}

# Schema.gql
scalar AWSTimestamp
scalar AWSURL
scalar AWSJSON

schema {
    query: Query
    mutation: Mutation
}