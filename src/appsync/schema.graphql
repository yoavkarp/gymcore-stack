}

type CardioExercise {
  id: ID!
  xid: ID!
  name: String!
  type: ExerciseType!
  notes: String
  machine_number: String
  seat_height: String
  angle: Parameter
  resistance: Parameter
  intervals: [CardioExerciseInterval]
}

type StrengthExerciseSet {
  id: ID!
  reps: Parameter
  rest: Parameter
  weight: Parameter
  dropsets: [StrengthExerciseDropSet!]
}

type StrengthExerciseDropSet {
  id: ID!
  reps: Parameter
  weight: Parameter
}

type CardioExerciseInterval {
  id: ID!
  duration: Parameter
  distance: Parameter
  tempo: Parameter
  intensity: Parameter
  angle: Parameter
  resistance: Parameter
  rest: Parameter
}

type Parameter {
  val: Float
  max: Float
  unit: String
}

scalar AWSTimestamp

scalar AWSURL

scalar AWSJSON

scalar AWSDateTime

scalar AWSDate

scalar AWSTime

scalar AWSPhone

scalar AWSIPAddress

scalar AWSEmail

schema {
  query: Query
  mutation: Mutation
}

