interface Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
}

enum Gender {
  MALE
  FEMALE
  OTHER
}

type Goal implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  memberId: ID!
  clubId: ID
  title: String!
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
  completed: Boolean
  completed_at: AWSDateTime
}

type GoalConnection {
  items: [Goal!]
  nextToken: String
}

type Mutation {
  createMeasurement(input: CreateMeasurementInput!): Measurement @aws_auth(cognito_groups: ["club", "member"])
  createMeasurementForMember(memberId: ID!, input: CreateMeasurementInput!): Measurement @aws_auth(cognito_groups: ["club"])
  createMember(input: CreateMemberInput!): Member @aws_auth(cognito_groups: ["club"])
  createTrainer(input: CreateTrainerInput!): Trainer @aws_auth(cognito_groups: ["club"])
  createWorkout(input: CreateWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateWorkout(workoutId: ID!, input: UpdateWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteWorkout(workoutId: ID!): Workout @aws_auth(cognito_groups: ["club"])
  addExerciseToWorkout(workoutId: ID!, input: AddExerciseToWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateExerciseInWorkout(workoutId: ID!, exerciseId: ID!, input: UpdateExerciseInWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteExerciseFromWorkout(workoutId: ID!, exerciseId: ID!): Workout @aws_auth(cognito_groups: ["club"])
  addSetToExercise(workoutId: ID!, exerciseId: ID!, input: SetInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateSetInExercise(workoutId: ID!, exerciseId: ID!, setId: ID!, input: SetInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteSetFromExercise(workoutId: ID!, exerciseId: ID!, setId: ID!): Workout @aws_auth(cognito_groups: ["club"])
  addIntervalToExercise(workoutId: ID!, exerciseId: ID!, input: IntervalInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateIntervalInExercise(workoutId: ID!, exerciseId: ID!, intervalId: ID!, input: IntervalInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteIntervalFromExercise(workoutId: ID!, exerciseId: ID!, intervalId: ID!): Workout @aws_auth(cognito_groups: ["club"])
  register(input: RegisterInput!): Member @aws_auth(cognito_groups: ["member"])
  updateMemberProfile(input: UpdateMemberProfileInput!): Member @aws_auth(cognito_groups: ["member"])
}

type Query {
  getClubById(clubId: ID!): Club @aws_auth(cognito_groups: ["club", "member"])
  getTrainerById(trainerId: ID!): Trainer @aws_auth(cognito_groups: ["club", "member"])
  getTenant: Tenant @aws_auth(cognito_groups: ["club", "member"])
  getWorkoutById(workoutId: ID!): Workout @aws_auth(cognito_groups: ["club", "member"])
  getClubTrainers: [Trainer!] @aws_auth(cognito_groups: ["club"])
  getMemberById(memberId: ID!): Member @aws_auth(cognito_groups: ["club"])
  searchMembers(text: String!): [Member] @aws_auth(cognito_groups: ["club"])
}

type Trainer implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  phone_number: AWSPhone!
  name: String!
  email: AWSEmail
  birthdate: AWSDate!
  gender: Gender!
  address: String
}

type TrainerConnection {
  items: [Trainer!]
  nextToken: String
}

type Workout implements Document {
  id: ID!
  tenantId: ID!
  clubId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  trainerId: ID!
  memberId: ID
  name: String!
  notes: String
  exercises: [Exercise!]
}

type WorkoutConnection {
  items: [Workout!]
  nextToken: String
}

union Exercise = StrengthExercise | CardioExercise

type StrengthExercise {
  id: ID!
  xid: ID!
  name: String!
  notes: String
  machine_number: String
  seat_height: String
  angle: Parameter
  resistance: Parameter
  sets: [StrengthExerciseSet]
}

type CardioExercise {
  id: ID!
  xid: ID!
  name: String!
  notes: String
  machine_number: String
  seat_height: String
  angle: Parameter
  resistance: Parameter
  intervals: [CardioExerciseInterval]
}

type StrengthExerciseSet {
  id: ID!
  reps: Parameter
  rest: Parameter
  weight: Parameter
  times: Parameter
}

type CardioExerciseInterval {
  id: ID!
  duration: Parameter
  distance: Parameter
  tempo: Parameter
  intensity: Parameter
  angle: Parameter
  resistance: Parameter
  rest: Parameter
}

type Parameter {
  val: Float
  max: Float
  unit: String
}

type Measurement implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  memberId: ID!
  clubId: ID
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
}

type MeasurementConnection {
  items: [Measurement!]
  nextToken: String
}

input CreateMeasurementInput {
  memberId: ID
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
}

scalar AWSTimestamp

scalar AWSURL

scalar AWSJSON

scalar AWSDateTime

scalar AWSDate

scalar AWSTime

scalar AWSPhone

scalar AWSIPAddress

scalar AWSEmail

schema {
  query: Query
  mutation: Mutation
}

type Tenant {
  id: ID!
  name: String!
  email: AWSEmail!
  phone_number: AWSPhone!
  profile_picture: AWSURL!
  address: String!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
}

type Club implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  name: String!
  email: AWSEmail!
  phone_number: AWSPhone!
  profile_picture: AWSURL!
  address: String!
}

type ClubConnection {
  items: [Club!]
  nextToken: String
}

type Member implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  name: String
  email: AWSEmail
  phone_number: AWSPhone
  profile_picture: AWSURL
  address: String
  birthdate: AWSDate
  gender: String
  registered: Boolean
  status: AWSJSON
  measurement: Measurement
  goal: Goal
  profile_workouts: WorkoutConnection
}

type MemberConnection {
  items: [Member!]
  nextToken: String
}

input CreateMemberMeasurementInput {
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
}

input CreateMemberInput {
  phone_number: AWSPhone!
  name: String!
  email: AWSEmail
  birthdate: AWSDate!
  gender: Gender!
  address: String
  measurement: CreateMemberMeasurementInput
}

input CreateTrainerInput {
  phone_number: AWSPhone!
  name: String!
  email: AWSEmail
  birthdate: AWSDate!
  gender: Gender!
  address: String
}

input UpdateWorkoutInput {
  name: String
  notes: String
}

input CreateWorkoutInput {
  name: String!
  trainerId: ID!
  memberId: ID
  planId: ID
}

input AddExerciseToWorkoutInput {
  xid: ID!
  name: String!
  type: ExerciseType!
}

input UpdateExerciseInWorkoutInput {
  xid: ID
  name: String
  type: ExerciseType
  notes: String
  machine_number: String
  seat_height: String
  angle: ParameterInput
  resistance: ParameterInput
}

input SetInput {
  reps: ParameterInput
  rest: ParameterInput
  weight: ParameterInput
  times: ParameterInput
}

input IntervalInput {
  duration: ParameterInput
  distance: ParameterInput
  tempo: ParameterInput
  intensity: ParameterInput
  angle: ParameterInput
  resistance: ParameterInput
  rest: ParameterInput
}

input ParameterInput {
  val: Float
  max: Float
  unit: String
}

enum ExerciseType {
  STRENGTH
  CARDIO
}

input RegisterInput {
  name: String!
  email: AWSEmail
  profile_picture: AWSURL
  address: String
  birthdate: AWSDate!
  gender: Gender!
}

input UpdateMemberProfileInput {
  name: String
  email: AWSEmail
  profile_picture: AWSURL
  address: String
  birthdate: AWSDate
  gender: Gender
}