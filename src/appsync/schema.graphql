    dis: Float
    intens: RangedUnit
    tempo: Float
    thr: RangedUnit
    time: Float
}

type DropSetData {
    reps: RangedUnit
    weight: RangedUnit
}

type RangedUnit {
    min: Float
    max: Float
    unit: String
}

type WorkoutConnection {
    items: [Workout!]
    nextToken: String
}

