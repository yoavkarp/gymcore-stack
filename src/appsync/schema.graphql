# Club.gql
type Club {
    id: ID!
    tenantId: ID!
    
    name: String!
    email: AWSEmail!
    phone_number: AWSPhone!
    profile_picture: AWSURL!
    address: String!

    created_at: AWSTimestamp!
    updated_at: AWSTimestamp!
}

# Goal.gql
type Goal {
    id: ID!
    tenantId: ID!
    memberId: ID!
    clubId: ID

    title: String!
    weight: Float
    height: Float
    fat: Float
    heart_rate: Float

    completed: Boolean
    completed_at: AWSDateTime

    created_at: AWSDateTime!
    updated_at: AWSDateTime!
}

type GoalConnection {
    items: [Goal!]
    nextToken: String
}

input CreateGoalInput {
    memberId: ID
    title: String!
    weight: Float
    height: Float
    fat: Float
    heart_rate: Float
}

input UpdateGoalInput {
    memberId: ID
    title: String
    weight: Float
    height: Float
    fat: Float
    heart_rate: Float
}

# Measurement.gql
type Measurement {
    id: ID!
    tenantId: ID!
    memberId: ID!
    clubId: ID

    weight: Float
    height: Float
    fat: Float
    heart_rate: Float

    created_at: AWSDateTime!
    updated_at: AWSDateTime!
}

type MeasurementConnection {
    items: [Measurement!]
    nextToken: String
}

input CreateMeasurementInput {
    memberId: ID
    weight: Float
    height: Float
    fat: Float
    heart_rate: Float
}

# Member.gql
type Member {
    id: ID!
    tenantId: ID!

    name: String
    email: AWSEmail
    phone_number: AWSPhone

    profile_picture: AWSURL
    address: String
    birthdate: AWSDate
    gender: String

    registered: Boolean
    
    clubsIds: [ID!]

    measurement: Measurement
    goal: Goal

    created_at: AWSDateTime!
    updated_at: AWSDateTime!
}

type MemberConnection {
    items: [Member!]
    nextToken: String
}

input CreateMemberInput {
    phone_number: AWSPhone!
}

input UpdateAuthenticatedMemberInput {
    name: String
    email: AWSEmail
    profile_picture: AWSURL
    address: String
    birthdate: AWSDate
    gender: String
}

input FirstTimeMemberRegisterInput {
    name: String!
    email: AWSEmail
    profile_picture: AWSURL
    address: String
    birthdate: AWSDate!
    gender: String!
}

# Mutation.gql
type Mutation {
    # Member
    createMember(input: CreateMemberInput!): Member @aws_auth(cognito_groups: ["club"])
    deleteMember(memberId: ID!): Member @aws_auth(cognito_groups: ["club"])

    updateAuthenticatedMember(input: UpdateAuthenticatedMemberInput!): Member @aws_auth(cognito_groups: ["member"])
    firstTimeMemberRegister(input: FirstTimeMemberRegisterInput!): Member @aws_auth(cognito_groups: ["member"])

    createMeasurement(input: CreateMeasurementInput!): Measurement @aws_auth(cognito_groups: ["club", "member"])
    createGoal(input: CreateGoalInput!): Goal @aws_auth(cognito_groups: ["club", "member"])
    updateGoal(goalId: ID!, input: UpdateGoalInput!): Goal @aws_auth(cognito_groups: ["club", "member"])
}

# Query.gql
type Query {
    getMemberById(memberId: ID!): Member @aws_auth(cognito_groups: ["admin", "club"])
    getAuthenticatedMember: Member @aws_auth(cognito_groups: ["member"])

    getClubById(clubId: ID!): Club @aws_auth(cognito_groups: ["admin", "club", "member"])
    getAuthenticatedClub: Club @aws_auth(cognito_groups: ["club"])

    getTenant: Tenant @aws_auth(cognito_groups: ["admin", "club", "member"])
}

# Schema.gql
scalar AWSTimestamp
scalar AWSURL
scalar AWSJSON
scalar AWSDateTime
scalar AWSDate
scalar AWSTime
scalar AWSPhone
scalar AWSIPAddress
scalar AWSEmail

schema {
    query: Query
    mutation: Mutation
}

# Tenant.gql
type Tenant {
    id: ID!

    name: String!
    email: AWSEmail!
    phone_number: AWSPhone!
    profile_picture: AWSURL!
    address: String!

    created_at: AWSDateTime!
    updated_at: AWSDateTime!
}

# Trainer.gql
type Trainer {
    id: String!
    clubId: ID!
    tenantId: ID!

    clubsIds: [ID!]!

    name: String!
    email: AWSEmail!
    phone_number: AWSPhone!
    profile_picture: AWSURL

    created_at: AWSDateTime!
    updated_at: AWSDateTime!
}

type TrainerConnection {
    items: [Trainer!]
    nextToken: String
}