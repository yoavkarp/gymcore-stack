interface Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
}

enum Gender {
  MALE
  FEMALE
  OTHER
}

type Goal implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  memberId: ID!
  clubId: ID
  title: String!
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
  completed: Boolean
  completed_at: AWSDateTime
}

type GoalConnection {
  items: [Goal!]
  nextToken: String
}

type Measurement implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  memberId: ID!
  clubId: ID
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
}

type MeasurementConnection {
  items: [Measurement!]
  nextToken: String
}

input CreateMeasurementInput {
  memberId: ID
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
}

type Mutation {
  createMeasurement(input: CreateMeasurementInput!): Measurement @aws_auth(cognito_groups: ["club", "member"])
  createMember(input: CreateMemberInput!): Member @aws_auth(cognito_groups: ["club"])
  createTrainer(input: CreateTrainerInput!): Trainer @aws_auth(cognito_groups: ["club"])
  createWorkout(input: CreateWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  register(input: RegisterInput!): Member @aws_auth(cognito_groups: ["member"])
  updateMemberProfile(input: UpdateMemberProfileInput!): Member @aws_auth(cognito_groups: ["member"])
}

type Query {
  getClubById(clubId: ID!): Club @aws_auth(cognito_groups: ["club", "member"])
  getTrainerById(trainerId: ID!): Trainer @aws_auth(cognito_groups: ["club", "member"])
  getTenant: Tenant @aws_auth(cognito_groups: ["club", "member"])
  getWorkoutById(id: ID!): Workout @aws_auth(cognito_groups: ["club", "member"])
  getMemberById(memberId: ID!): Member @aws_auth(cognito_groups: ["club"])
  getTrainers: [Trainer!] @aws_auth(cognito_groups: ["club"])
  searchMembers(text: String!): [Member] @aws_auth(cognito_groups: ["club"])
}

scalar AWSTimestamp

scalar AWSURL

scalar AWSJSON

scalar AWSDateTime

scalar AWSDate

scalar AWSTime

scalar AWSPhone

scalar AWSIPAddress

scalar AWSEmail

schema {
  query: Query
  mutation: Mutation
}

type Tenant {
  id: ID!
  name: String!
  email: AWSEmail!
  phone_number: AWSPhone!
  profile_picture: AWSURL!
  address: String!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
}

type Trainer implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  phone_number: AWSPhone!
  name: String!
  email: AWSEmail
  birthdate: AWSDate!
  gender: Gender!
  address: String
}

type TrainerConnection {
  items: [Trainer!]
  nextToken: String
}

type Workout implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  name: String!
  notes: String
  exercises: [Exercise!]!
  trainerId: ID!
  memberId: ID
}

type Exercise {
  id: ID!
  xid: ID!
  name: String!
  section: ExerciseSection!
  notes: String
  machine_number: String
  seat_height: String
  angle: ExerciseValue
  resistance: ExerciseValue
  sets: Int
  reps: ExerciseValue
  rest: ExerciseValue
  weight: ExerciseValue
  duration: ExerciseValue
  distance: ExerciseValue
  tempo: ExerciseValue
  intensity: ExerciseValue
}

type ExerciseValue {
  min: Float
  max: Float
  val: Float
  unit: String
}

enum ExerciseSection {
  WARMUP
  STRENGTH
  CARDIO
  COOLDOWN
}

type Club implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  name: String!
  email: AWSEmail!
  phone_number: AWSPhone!
  profile_picture: AWSURL!
  address: String!
}

type ClubConnection {
  items: [Club!]
  nextToken: String
}

type Member implements Document {
  id: ID!
  tenantId: ID!
  created_at: AWSDateTime!
  updated_at: AWSDateTime!
  name: String
  email: AWSEmail
  phone_number: AWSPhone
  profile_picture: AWSURL
  address: String
  birthdate: AWSDate
  gender: String
  registered: Boolean
  status: AWSJSON
  measurement: Measurement
  goal: Goal
}

type MemberConnection {
  items: [Member!]
  nextToken: String
}

input CreateMemberInput {
  phone_number: AWSPhone!
  name: String!
  email: AWSEmail
  birthdate: AWSDate!
  gender: Gender!
  address: String
  measurement: CreateMemberMeasurementInput
}

input CreateMemberMeasurementInput {
  weight: Float
  height: Float
  fat: Float
  heart_rate: Float
}

input CreateTrainerInput {
  phone_number: AWSPhone!
  name: String!
  email: AWSEmail
  birthdate: AWSDate!
  gender: Gender!
  address: String
}

input CreateWorkoutInput {
  name: String!
  notes: String
  exercises: [CreateExerciseInput!]!
  trainerId: ID!
  memberId: ID
  clubId: ID!
}

input CreateExerciseInput {
  name: String!
  section: ExerciseSection!
  notes: String
  machine_number: String
  seat_height: String
  angle: ExerciseValueInput
  resistance: ExerciseValueInput
  sets: Int
  reps: ExerciseValueInput
  rest: ExerciseValueInput
  weight: ExerciseValueInput
  duration: ExerciseValueInput
  distance: ExerciseValueInput
  tempo: ExerciseValueInput
  intensity: ExerciseValueInput
}

input ExerciseValueInput {
  min: Float
  max: Float
  val: Float
  unit: String
}

input RegisterInput {
  name: String!
  email: AWSEmail
  profile_picture: AWSURL
  address: String
  birthdate: AWSDate!
  gender: Gender!
}

input UpdateMemberProfileInput {
  name: String
  email: AWSEmail
  profile_picture: AWSURL
  address: String
  birthdate: AWSDate
  gender: Gender
}