# member.gql
type Member {
    id: ID!

    userId: ID!
    user: User!

    tenantId: ID!
    tenant: Tenant!

    level: String
    weeklyAvailability: Int
    profileWorkouts: WorkoutConnection
    activeWorkout: ActiveWorkout

    activePlanId: ID
    activePlan: Plan

    createdAt: AWSTimestamp!
    updatedAt: AWSTimestamp!
}

type MemberConnection {
    items: [Member!]
    nextToken: String
}

input CreateMemberInput {
    name: String!
    email: String!
    phoneNumber: String!
}

# mutation.gql
type Mutation {
    # Member
    createMember(input: CreateMemberInput!): Member
    deleteMember(memberId: ID!): Member
}

# plan.gql
# Plan
type Plan  {
    id: ID!

    memberId: ID!
    member: Member

    trainerId: ID!
    trainer: Trainer

    clubId: ID!
    club: Club

    name: String!
    notes: String

    trainingPlanId: ID!
    workouts: WorkoutConnection

    weeks: Int!
    meetings: Int!
    completed: [CompletedWorkout!]
        
    createdAt: AWSTimestamp!
    updatedAt: AWSTimestamp!

    events: EventConnection
}

type CompletedWorkout {
    activeWorkoutId: ID!
    activeWorkout: ActiveWorkout
    workoutId: ID!
    workout: Workout
    time: AWSTimestamp!
}

type PlanConnection {
    items: [Plan!]
    nextToken: String
}

# query.gql
type Query {
    getMemberById(memberId: String!): Member @aws_auth(cognito_groups: ["admin", "club", "trainer"])
    searchMembers(query: String!, limit: Int): [Member!] @aws_auth(cognito_groups: ["admin", "club", "trainer"])
    getAuthData: Member @aws_auth(cognito_groups: ["admin", "club", "trainer", "member"])
}

input ListQueryInput {
    nextToken: String
    limit: Int
}

