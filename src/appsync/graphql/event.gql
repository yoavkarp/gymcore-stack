# Event

type Event  {
    id: ID!

    clubId: ID!
    club: Club!

    tenantId: ID!
    tenant: Tenant!

    trainerId: ID!
    trainer: Trainer

    memberId: ID!
    member: Member

    startAt: AWSTimestamp!
    endAt: AWSTimestamp!
    
    planId: ID
    plan: Plan

    createdAt: AWSTimestamp!
    updatedAt: AWSTimestamp!
}

type EventConnection {
    items: [Event!]
    nextToken: String
}