type Workout {
    id: ID!
    name: String!
    notes: String

    clubId: ID
    club: Club

    memberId: ID!
    member: Member

    trainerId: ID!
    trainer: Trainer

    exercises: [WorkoutExercise!]
    
    level: String

    createdAt: AWSTimestamp!
    updatedAt: AWSTimestamp!
}

type WorkoutExercise {
    id: ID!

    exerciseId: ID!
    exercise: Exercise
    
    name: String!
    notes: String
    type: String!

    data: [WorkoutExerciseData!]
    group: [WorkoutExercise]
    mn: String
    sh: String

    createdAt: AWSTimestamp!
    updatedAt: AWSTimestamp!
}

type WorkoutExerciseData {
    reps: RangedUnit
    weight: RangedUnit
    rest: RangedUnit
    dropsets: [DropSetData]
    resist: Float
    angle: Float
    dis: Float
    intens: RangedUnit
    tempo: Float
    thr: RangedUnit
    time: Float
}

type DropSetData {
    reps: RangedUnit
    weight: RangedUnit
}

type RangedUnit {
    min: Float
    max: Float
    unit: String
}

type WorkoutConnection {
    items: [Workout!]
    nextToken: String
}