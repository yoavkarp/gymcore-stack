type Goal implements Document {
    id: ID!
    tenantId: ID!
    created_at: AWSDateTime!
    updated_at: AWSDateTime!
    
    memberId: ID!
    clubId: ID

    title: String!
    weight: Float
    height: Float
    fat: Float
    heart_rate: Float

    completed: Boolean
    completed_at: AWSDateTime
}

type GoalConnection {
    items: [Goal!]
    nextToken: String
}