type Workout implements Document {
  id: ID!
  tenantId: ID!
  clubId: ID!
  
  created_at: AWSDateTime!
  updated_at: AWSDateTime!

  trainerId: ID!
  memberId: ID

  name: String!
  notes: String
  exercises: [Exercise!]
}

type WorkoutConnection {
  items: [Workout!]
  nextToken: String
}

union Exercise = StrengthExercise | CardioExercise

type StrengthExercise {
  id: ID!
  xid: ID!
  name: String!
  type: ExerciseType!
  # common
  notes: String
  machine_number: String
  seat_height: String
  angle: Parameter
  resistance: Parameter
  # strength
  sets: [StrengthExerciseSet]
}

type CardioExercise {
  id: ID!
  xid: ID!
  name: String!
  type: ExerciseType!
  # common
  notes: String
  machine_number: String
  seat_height: String
  angle: Parameter
  resistance: Parameter
  # cardio
  intervals: [CardioExerciseInterval]
}

type StrengthExerciseSet {
  id: ID!
  reps: Parameter
  rest: Parameter
  weight: Parameter
  times: Parameter
}

type CardioExerciseInterval {
  id: ID!
  duration: Parameter
  distance: Parameter
  tempo: Parameter
  intensity: Parameter
  angle: Parameter
  resistance: Parameter
  rest: Parameter
}

type Parameter {
  val: Float
  max: Float
  unit: String
}

fragment ParameterFragment on Parameter {
  max
  val
  unit
}