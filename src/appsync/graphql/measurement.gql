type Measurement {
    id: ID!
    tenantId: ID!
    memberId: ID!
    clubId: ID

    weight: Float
    height: Float
    fat: Float
    heart_rate: Float

    created_at: AWSDateTime!
    updated_at: AWSDateTime!
}

type MeasurementConnection {
    items: [Measurement!]
    nextToken: String
}

input CreateMeasurementInput {
    memberId: ID!
    weight: Float
    height: Float
    fat: Float
    heart_rate: Float
}