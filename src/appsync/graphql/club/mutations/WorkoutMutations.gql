extend type Mutation {
  createWorkout(input: CreateWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateWorkout(workoutId: ID!, input: UpdateWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteWorkout(workoutId: ID!): Workout @aws_auth(cognito_groups: ["club"])

  addExerciseToWorkout(workoutId: ID!, input: AddExerciseToWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateExerciseInWorkout(workoutId: ID!, exerciseId: ID!, input: UpdateExerciseInWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteExerciseFromWorkout(workoutId: ID!, exerciseId: ID!): Workout @aws_auth(cognito_groups: ["club"])

  addSetToExercise(workoutId: ID!, exerciseId: ID!, input: SetInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateSetInExercise(workoutId: ID!, exerciseId: ID!, setId: ID!, input: SetInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteSetFromExercise(workoutId: ID!, exerciseId: ID!, setId: ID!): Workout @aws_auth(cognito_groups: ["club"])

  addIntervalToExercise(workoutId: ID!, exerciseId: ID!, input: IntervalInput!): Workout @aws_auth(cognito_groups: ["club"])
  updateIntervalInExercise(workoutId: ID!, exerciseId: ID!, intervalId: ID!, input: IntervalInput!): Workout @aws_auth(cognito_groups: ["club"])
  deleteIntervalFromExercise(workoutId: ID!, exerciseId: ID!, intervalId: ID!): Workout @aws_auth(cognito_groups: ["club"])

  addWorkoutToLibrary(workoutId: ID!): Workout @aws_auth(cognito_groups: ["club"])

  moveSetInExercise(workoutId: ID!, exerciseId: ID!, from: Int!, to: Int!): Workout @aws_auth(cognito_groups: ["club"])
  moveIntervalInExercise(workoutId: ID!, exerciseId: ID!, from: Int!, to: Int!): Workout @aws_auth(cognito_groups: ["club"])
  moveExerciseInWorkout(workoutId: ID!, from: Int!, to: Int!): Workout @aws_auth(cognito_groups: ["club"])
}

input UpdateWorkoutInput {
  name: String
  notes: String
}

input CreateWorkoutInput {
  name: String!
  trainerId: ID!
  memberId: ID
  planId: ID
}

input AddExerciseToWorkoutInput {
  xid: ID!
  name: String!
  type: ExerciseType!
  machine_number: String
  seat_height: String
  notes: String
}

input UpdateExerciseInWorkoutInput {
  xid: ID
  name: String
  type: ExerciseType
  # common
  notes: String
  machine_number: String
  seat_height: String
}

input SetInput {
  reps: ParameterInput
  rest: ParameterInput
  weight: ParameterInput
  times: Int
  dropsets: [StrengthExerciseDropSetInput!]
}

input StrengthExerciseDropSetInput {
  reps: ParameterInput
  weight: ParameterInput
  times: Int
}

input IntervalInput {
  duration: ParameterInput
  distance: ParameterInput
  tempo: ParameterInput
  intensity: ParameterInput
  angle: ParameterInput
  resistance: ParameterInput
  rest: ParameterInput
}

input ParameterInput {
    val: Float
    max: Float
    unit: String
}

enum ExerciseType {
  STRENGTH
  CARDIO
}