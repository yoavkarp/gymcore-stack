extend type Mutation {
  createWorkout(input: CreateWorkoutInput!): Workout @aws_auth(cognito_groups: ["club"])
}

input CreateWorkoutInput {
  name: String!
  notes: String
  exercises: [CreateExerciseInput!]!
  trainerId: ID!
  memberId: ID
}

input CreateExerciseInput {
    name: String!
    type: ExerciseType!
    # common
    notes: String
    machine_number: String
    seat_height: String
    angle: ParameterInput
    resistance: ParameterInput
    # strength
    sets: [StrengthExerciseSetInput]
    # cardio
    intervals: [CardioExerciseIntervalInput]
}

input StrengthExerciseSetInput {
  id: ID!
  reps: ParameterInput
  rest: ParameterInput
  weight: ParameterInput
  times: ParameterInput
}

input CardioExerciseIntervalInput {
  id: ID!
  duration: ParameterInput
  distance: ParameterInput
  tempo: ParameterInput
  intensity: ParameterInput
  angle: ParameterInput
  resistance: ParameterInput
  rest: ParameterInput
}

input ParameterInput {
    min: Float
    max: Float
    val: Float
    unit: String
}

enum ExerciseType {
  STRENGTH
  CARDIO
}