type Trainer implements Document {
    id: ID!
    tenantId: ID!
    created_at: AWSDateTime!
    updated_at: AWSDateTime!
    
    phone_number: AWSPhone!
    name: String!
    email: AWSEmail
    birthdate: AWSDate!
    gender: Gender!
    address: String

    picture: AWSURL
}

type TrainerConnection {
    items: [Trainer!]
    nextToken: String
}