type Member {
    id: ID!
    tenantId: ID!

    name: String
    email: AWSEmail
    phone_number: AWSPhone

    profile_picture: AWSURL
    address: String
    birthdate: AWSDate
    gender: String

    registered: Boolean
    
    clubsIds: [ID!]

    measurement: Measurement
    goal: Goal

    created_at: AWSDateTime!
    updated_at: AWSDateTime!
}

type MemberConnection {
    items: [Member!]
    nextToken: String
}

input CreateMemberInput {
    phone_number: AWSPhone!
}

input UpdateAuthenticatedMemberInput {
    name: String
    email: AWSEmail
    profile_picture: AWSURL
    address: String
    birthdate: AWSDate
    gender: String
}

input FirstTimeMemberRegisterInput {
    name: String!
    email: AWSEmail
    profile_picture: AWSURL
    address: String
    birthdate: AWSDate!
    gender: String!
}