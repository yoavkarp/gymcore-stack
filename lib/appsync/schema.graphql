# Member.gql
type Member {
    id: String!
    name: String!
    email: String!
    phoneNumber: String!
    status: String!
    createdAt: AWSTimestamp!
    updatedAt: AWSTimestamp!
}

type MemberConnection {
    items: [Member!]
    nextToken: String
}

input InviteMemberInput {
    name: String!
    email: String!
    phoneNumber: String!
}

# Mutation.gql
type Mutation {
    inviteMember(input: InviteMemberInput!): Member
    deleteMember(id: String!): Member
}

# Query.gql
type Query {
    getMemberById(id: String!): Member @aws_auth(cognito_groups: ["admin", "club", "trainer"])
    searchMembers(query: String!, limit: Int): [Member!] @aws_auth(cognito_groups: ["admin", "club", "trainer"])
    getAuthData: Member @aws_auth(cognito_groups: ["admin", "club", "trainer", "member"])
}

input ListQueryInput {
    nextToken: String
    limit: Int
}

# Schema.gql
scalar AWSTimestamp
scalar AWSURL
scalar AWSJSON

schema {
    query: Query
    mutation: Mutation
}

# Trainer.gql
type Trainer {
    id: String!
    name: String!
    email: String!
    phoneNumber: String!
    status: String!
    createdAt: AWSTimestamp!
    updatedAt: AWSTimestamp!
}

type TrainerConnection {
    items: [Trainer!]
    nextToken: String
}